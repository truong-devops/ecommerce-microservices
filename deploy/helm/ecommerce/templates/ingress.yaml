{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ecommerce.fullname" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    - host: {{ $host.host }}
      http:
        paths:
          {{- range $route := $host.routes }}
          {{- $svc := index $.Values.services $route.service }}
          {{- if and $svc $svc.enabled }}
          - path: {{ $route.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $route.service }}
                port:
                  name: http
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
