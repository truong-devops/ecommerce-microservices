global:
  existingSecret: ecommerce-runtime-env
  env:
    APP_ENV: production
    LOG_FORMAT: json
    OTEL_SERVICE_NAMESPACE: ecommerce

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ecommerce.local
      routes:
        - path: /api
          service: api-gateway
        - path: /
          service: buyer-web
    - host: seller.ecommerce.local
      routes:
        - path: /
          service: seller
    - host: moderator.ecommerce.local
      routes:
        - path: /
          service: moderator

defaults:
  replicas: 1
  image:
    registry: harbor.example.com
    project: ecommerce
    tag: stable
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

services:
  api-gateway:
    enabled: true
    port: 8080
    env:
      AUTH_SERVICE_URL: http://auth-service:8080
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      CART_SERVICE_URL: http://cart-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      SHIPPING_SERVICE_URL: http://shipping-service:8080
      REVIEW_SERVICE_URL: http://review-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      ANALYTICS_SERVICE_URL: http://analytics-service:8080
      CHAT_SERVICE_URL: http://chat-service:8080
      LIVE_SERVICE_URL: http://live-service:8080
  auth-service:
    enabled: true
    port: 8080
  user-service:
    enabled: true
    port: 8080
  product-service:
    enabled: true
    port: 8080
  cart-service:
    enabled: true
    port: 8080
  order-service:
    enabled: true
    port: 8080
  payment-service:
    enabled: true
    port: 8080
  inventory-service:
    enabled: true
    port: 8080
  shipping-service:
    enabled: true
    port: 8080
  notification-service:
    enabled: true
    port: 8080
  analytics-service:
    enabled: true
    port: 8080
  review-service:
    enabled: true
    port: 8080
  chat-service:
    enabled: true
    port: 8080
  media-service:
    enabled: true
    port: 8080
  live-service:
    enabled: true
    port: 8080
  buyer-web:
    enabled: true
    port: 3000
  seller:
    enabled: true
    port: 3000
  moderator:
    enabled: true
    port: 3000
