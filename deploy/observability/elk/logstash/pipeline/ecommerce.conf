input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => {
      "environment" => "local"
    }
  }

  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
  }

  if [app] {
    mutate {
      rename => {
        "[app][level]" => "level"
        "[app][service]" => "service"
        "[app][event]" => "event_action"
        "[app][request_id]" => "request_id"
        "[app][method]" => "method"
        "[app][path]" => "path"
        "[app][status]" => "status"
        "[app][duration_ms]" => "duration_ms"
        "[app][client_ip]" => "client_ip"
        "[app][message]" => "app_message"
        "[app][error]" => "app_error"
        "[app][context]" => "context"
        "[app][trace]" => "trace"
      }
    }
  }

  if ![service] and [container][name] {
    mutate {
      copy => {
        "[container][name]" => "service"
      }
    }
  }

  if [event] and ![event][original] {
    mutate {
      rename => {
        "event" => "event_action"
      }
    }
  }

  if [service] {
    mutate {
      gsub => [
        "service", "^ecommerce-microservices-", "",
        "service", "-1$", ""
      ]
    }
  }

  mutate {
    convert => {
      "status" => "integer"
      "duration_ms" => "integer"
    }
  }
}

output {
  elasticsearch {
    hosts => [ "${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}" ]
    index => "ecommerce-logs-local-%{+YYYY.MM.dd}"
  }
}
