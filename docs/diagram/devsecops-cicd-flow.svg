<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" role="img" aria-labelledby="title desc">
  <title id="title">DevSecOps CI/CD and GitOps Deployment Flow</title>
  <desc id="desc">A professional diagram showing the ecommerce microservices deployment flow from developer and GitHub through Jenkins CI, security gates, Docker Hub, Jenkins CD, Argo CD, Kubernetes, Prometheus, Grafana, and notifications.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>

    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #dbeafe; }
      .group { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; rx: 22; }
      .group-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 16; filter: url(#softShadow); }
      .node-ci { fill: #eff6ff; stroke: #60a5fa; }
      .node-sec { fill: #fef3c7; stroke: #f59e0b; }
      .node-build { fill: #ecfeff; stroke: #06b6d4; }
      .node-cd { fill: #f5f3ff; stroke: #8b5cf6; }
      .node-runtime { fill: #ecfdf5; stroke: #10b981; }
      .node-monitor { fill: #fff7ed; stroke: #f97316; }
      .node-title { font: 700 15px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .lane-label { font: 700 14px Inter, Arial, sans-serif; fill: #475569; letter-spacing: 0.4px; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-muted { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 5; }
      .note { font: 600 13px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="820" />

  <rect x="0" y="0" width="1480" height="92" fill="url(#headerGradient)" />
  <text class="title" x="50" y="42">DevSecOps CI/CD and GitOps Deployment Flow</text>
  <text class="subtitle" x="50" y="68">Ecommerce microservices pipeline: validate, scan, build, publish, update GitOps manifests, deploy to Kubernetes, and monitor runtime health.</text>

  <rect class="group" x="270" y="125" width="1180" height="300" />
  <text class="group-title" x="300" y="158">Jenkins CI Job - Code And Quality Gates</text>

  <rect class="group" x="270" y="465" width="1180" height="280" />
  <text class="group-title" x="300" y="498">Jenkins CD Job - GitOps Release And Runtime</text>

  <text class="lane-label" x="34" y="210" transform="rotate(-90 34 210)">DEVELOPER WORKFLOW</text>
  <rect class="node" x="42" y="230" width="170" height="78" />
  <text class="node-title" x="72" y="262">Developer</text>
  <text class="node-text" x="72" y="283">Commit feature or fix</text>

  <rect class="node" x="42" y="350" width="170" height="78" />
  <text class="node-title" x="72" y="382">GitHub</text>
  <text class="node-text" x="72" y="403">Source repository</text>

  <path class="arrow" d="M127 308 L127 344" />
  <text class="small" x="142" y="333">Push code</text>

  <path class="arrow" d="M212 389 C245 389 247 205 290 205" />
  <text class="small" x="224" y="184">Pull code</text>

  <rect class="node node-ci" x="300" y="178" width="150" height="86" />
  <text class="node-title" x="325" y="211">Jenkins CI</text>
  <text class="node-text" x="325" y="233">Detect changes</text>
  <text class="node-text" x="325" y="249">Run validation</text>

  <rect class="node node-ci" x="488" y="178" width="150" height="86" />
  <text class="node-title" x="520" y="211">Build/Test</text>
  <text class="node-text" x="515" y="233">Unit tests</text>
  <text class="node-text" x="515" y="249">App builds</text>

  <rect class="node node-sec" x="676" y="178" width="170" height="86" />
  <text class="node-title" x="706" y="211">OWASP</text>
  <text class="node-text" x="704" y="233">Dependency</text>
  <text class="node-text" x="704" y="249">CVE check</text>

  <rect class="node node-sec" x="884" y="178" width="170" height="86" />
  <text class="node-title" x="923" y="211">SonarQube</text>
  <text class="node-text" x="918" y="233">Quality gate</text>
  <text class="node-text" x="918" y="249">Bug analysis</text>

  <rect class="node node-sec" x="1092" y="178" width="150" height="86" />
  <text class="node-title" x="1128" y="211">Trivy</text>
  <text class="node-text" x="1126" y="233">Filesystem</text>
  <text class="node-text" x="1126" y="249">security scan</text>

  <rect class="node node-build" x="488" y="305" width="170" height="82" />
  <text class="node-title" x="526" y="337">Docker</text>
  <text class="node-text" x="516" y="359">Build service image</text>

  <rect class="node node-sec" x="716" y="305" width="170" height="82" />
  <text class="node-title" x="762" y="337">Trivy</text>
  <text class="node-text" x="746" y="359">Container image scan</text>

  <rect class="node node-build" x="944" y="305" width="190" height="82" />
  <text class="node-title" x="984" y="337">Docker Hub</text>
  <text class="node-text" x="974" y="359">Push image:git-sha</text>

  <path class="arrow" d="M450 221 L482 221" />
  <path class="arrow" d="M638 221 L670 221" />
  <path class="arrow" d="M846 221 L878 221" />
  <path class="arrow" d="M1054 221 L1086 221" />
  <path class="arrow" d="M1167 264 C1167 296 1092 296 1092 343 L1134 343" />
  <path class="arrow" d="M563 264 L563 299" />
  <path class="arrow" d="M658 346 L710 346" />
  <path class="arrow" d="M886 346 L938 346" />

  <text class="lane-label" x="302" y="414">CI output: verified source code, scanned artifacts, and Docker image published with an immutable git SHA tag.</text>

  <path class="arrow-muted" d="M375 264 C375 430 375 430 375 542" />
  <text class="small" x="392" y="444">Trigger CD after main merge</text>

  <rect class="node node-cd" x="300" y="525" width="150" height="86" />
  <text class="node-title" x="325" y="558">Jenkins CD</text>
  <text class="node-text" x="324" y="580">GitOps release</text>

  <rect class="node node-cd" x="500" y="525" width="190" height="86" />
  <text class="node-title" x="536" y="558">Kustomize</text>
  <text class="node-text" x="528" y="580">Update image tag</text>

  <rect class="node" x="740" y="525" width="190" height="86" />
  <text class="node-title" x="786" y="558">GitHub</text>
  <text class="node-text" x="770" y="580">GitOps manifest commit</text>

  <rect class="node node-cd" x="980" y="525" width="160" height="86" />
  <text class="node-title" x="1022" y="558">Argo CD</text>
  <text class="node-text" x="1012" y="580">Pull Git state</text>

  <rect class="node node-runtime" x="1190" y="525" width="180" height="86" />
  <text class="node-title" x="1232" y="558">Kubernetes</text>
  <text class="node-text" x="1220" y="580">Rollout workloads</text>

  <path class="arrow" d="M450 568 L494 568" />
  <path class="arrow" d="M690 568 L734 568" />
  <path class="arrow" d="M930 568 L974 568" />
  <path class="arrow" d="M1140 568 L1184 568" />

  <rect class="node node-monitor" x="755" y="650" width="155" height="70" />
  <text class="node-title" x="786" y="679">Prometheus</text>
  <text class="node-text" x="784" y="699">Collect metrics</text>

  <rect class="node node-monitor" x="960" y="650" width="155" height="70" />
  <text class="node-title" x="996" y="679">Grafana</text>
  <text class="node-text" x="990" y="699">Dashboards</text>

  <rect class="node node-monitor" x="1165" y="650" width="155" height="70" />
  <text class="node-title" x="1204" y="679">Email</text>
  <text class="node-text" x="1193" y="699">Notify result</text>

  <path class="arrow" d="M1280 611 C1280 637 832 637 832 644" />
  <path class="arrow" d="M910 685 L954 685" />
  <path class="arrow" d="M1115 685 L1159 685" />

  <rect x="42" y="675" width="610" height="50" rx="14" fill="#e0f2fe" stroke="#38bdf8" />
  <text class="note" x="64" y="705">GitOps principle: Jenkins publishes images and updates Git. Argo CD is responsible for applying manifests to Kubernetes.</text>
</svg>
