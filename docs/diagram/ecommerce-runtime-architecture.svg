  <rect x="50" y="755" width="1400" height="56" rx="16" fill="#ecfeff" stroke="#06b6d4" />
  <text class="label" x="80" y="787">Runtime principle:</text>
  <text class="small" x="205" y="787">public traffic enters through Ingress and API Gateway; services own their business domains; Kafka decouples side effects; observability and access-control tools support operations.</text>
</svg>
