  <rect class="node edge" x="350" y="230" width="180" height="82" />
  <text class="node-title" x="392" y="260">Nginx Ingress</text>
  <text class="node-text" x="378" y="282">TLS + domain routing</text>

  <rect class="node edge" x="350" y="395" width="180" height="88" />
  <text class="node-title" x="393" y="427">API Gateway</text>
  <text class="node-text" x="385" y="449">JWT / CORS / rate limit</text>
  <text class="node-text" x="397" y="466">REST + WebSocket proxy</text>

