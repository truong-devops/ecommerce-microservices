<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Ecommerce Microservices Runtime Architecture</title>
  <desc id="desc">High-level runtime architecture for the ecommerce microservices platform, showing client applications, ingress, API gateway, backend services, data stores, messaging, media infrastructure, and observability tools.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155" />
    </marker>

    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #fff; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #ccfbf1; }
      .group { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .group-title { font: 700 18px Inter, Arial, sans-serif; fill: #0f172a; }
      .node { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .client { fill: #eff6ff; stroke: #60a5fa; }
      .edge { fill: #f5f3ff; stroke: #8b5cf6; }
      .service { fill: #ecfdf5; stroke: #10b981; }
      .data { fill: #fff7ed; stroke: #f97316; }
      .ops { fill: #fef2f2; stroke: #ef4444; }
      .node-title { font: 700 14px Inter, Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 500 12px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 700 13px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="900" />
  <rect x="0" y="0" width="1480" height="92" fill="url(#headerGradient)" />
  <text class="title" x="50" y="42">Ecommerce Microservices Runtime Architecture</text>
  <text class="subtitle" x="50" y="68">Client applications enter through Kubernetes Ingress and API Gateway, then reach domain services, data stores, messaging, media, and observability layers.</text>

  <rect class="group" x="40" y="130" width="220" height="560" />
  <text class="group-title" x="70" y="164">Client Apps</text>

  <rect class="node client" x="70" y="195" width="160" height="62" />
  <text class="node-title" x="98" y="220">Buyer Web</text>
  <text class="node-text" x="106" y="241">Next.js</text>

  <rect class="node client" x="70" y="285" width="160" height="62" />
  <text class="node-title" x="92" y="310">Buyer Mobile</text>
  <text class="node-text" x="116" y="331">Expo</text>

  <rect class="node client" x="70" y="375" width="160" height="62" />
  <text class="node-title" x="96" y="400">Seller Web</text>
  <text class="node-text" x="106" y="421">Next.js</text>

  <rect class="node client" x="70" y="465" width="160" height="62" />
  <text class="node-title" x="86" y="490">Moderator Web</text>
  <text class="node-text" x="106" y="511">Next.js</text>

